<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TV Online PMM - Canales IPTV en Vivo</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Hls.js CDN for playing HLS (.m3u8) streams -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      /* Custom scrollbar for channel list */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #1f2937;
      }
      ::-webkit-scrollbar-thumb {
        background: #374151;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #4b5563;
      }
    </style>
  </head>
  <body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col font-sans">
    <!-- Header -->
    <header class="bg-gray-900 border-b border-gray-800 sticky top-0 z-40 shadow-lg">
      <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row md:items-center md:justify-between gap-3">
        <div class="flex items-center space-x-3">
          <div class="bg-blue-600 p-2 rounded-xl text-white shadow-md shadow-blue-500/20">
            <i data-lucide="tv" class="w-6 h-6"></i>
          </div>
          <div>
            <h1 class="text-xl font-bold tracking-wide bg-gradient-to-r from-blue-400 to-indigo-300 bg-clip-text text-transparent">
              TV Online PMM
            </h1>
            <p class="text-xs text-gray-400">Reproductor IPTV en Vivo</p>
          </div>
        </div>

        <!-- Filters, Search & Actions -->
        <div class="flex flex-col sm:flex-row items-center gap-2 w-full md:w-auto">
          <!-- Copy M3U URL Button -->
          <button
            id="copy-m3u-btn"
            title="Copiar enlace del repositorio M3U"
            class="w-full sm:w-auto flex items-center justify-center space-x-2 bg-blue-600/20 hover:bg-blue-600 text-blue-400 hover:text-white px-3 py-2 rounded-lg border border-blue-500/30 hover:border-blue-500 text-sm font-medium transition-all duration-200 shadow-sm group cursor-pointer"
          >
            <i data-lucide="copy" id="copy-btn-icon" class="w-4 h-4 text-blue-400 group-hover:text-white transition-colors"></i>
            <span id="copy-btn-text">Copiar M3U</span>
          </button>

          <!-- Search Box -->
          <div class="relative w-full sm:w-60">
            <input
              type="text"
              id="search-input"
              placeholder="Buscar canal..."
              class="w-full bg-gray-800 text-sm text-gray-200 placeholder-gray-400 rounded-lg pl-9 pr-4 py-2 border border-gray-700 focus:outline-none focus:border-blue-500 transition-colors"
            />
            <i data-lucide="search" class="w-4 h-4 text-gray-400 absolute left-3 top-2.5"></i>
          </div>

          <!-- Category Filter -->
          <select
            id="group-select"
            class="w-full sm:w-44 bg-gray-800 text-sm text-gray-200 rounded-lg px-3 py-2 border border-gray-700 focus:outline-none focus:border-blue-500 transition-colors cursor-pointer"
          >
            <option value="ALL">Todas las Categorías</option>
          </select>
        </div>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 flex flex-col lg:flex-row gap-6">
      
      <!-- Left / Top: Video Player & Details Section -->
      <section class="lg:w-2/3 flex flex-col gap-4">
        <!-- Player Container -->
        <div class="bg-black rounded-2xl overflow-hidden shadow-2xl border border-gray-800 relative group aspect-video flex items-center justify-center">
          <video
            id="video-player"
            controls
            autoplay
            playsinline
            class="w-full h-full object-contain"
            poster=""
          ></video>

          <!-- Loading overlay -->
          <div id="player-loading" class="hidden absolute inset-0 bg-black/80 flex flex-col items-center justify-center gap-3 z-10">
            <div class="w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
            <span class="text-sm text-gray-300 font-medium">Cargando señal...</span>
          </div>

          <!-- Error / Idle State -->
          <div id="player-status" class="hidden absolute inset-0 bg-gray-900/90 flex flex-col items-center justify-center p-6 text-center z-10">
            <i data-lucide="alert-circle" class="w-12 h-12 text-amber-500 mb-2"></i>
            <p id="player-status-text" class="text-gray-300 font-medium max-w-md"></p>
            <button id="retry-btn" class="mt-4 px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold rounded-lg shadow transition">
              Reintentar reproducción
            </button>
          </div>
        </div>

        <!-- Currently Playing Channel Info & Metadata -->
        <div id="channel-details" class="bg-gray-900 rounded-2xl p-5 border border-gray-800 shadow-md">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div class="flex items-center space-x-4">
              <div class="w-16 h-16 bg-gray-800 rounded-xl p-2 flex items-center justify-center border border-gray-700 flex-shrink-0">
                <img
                  id="current-channel-logo"
                  src="https://via.placeholder.com/80?text=TV"
                  alt="Logo Canal"
                  class="max-w-full max-h-full object-contain"
                  onerror="this.onerror=null; this.src='https://via.placeholder.com/80?text=TV';"
                />
              </div>
              <div>
                <h2 id="current-channel-name" class="text-xl font-bold text-white">
                  Selecciona un canal
                </h2>
                <div class="flex flex-wrap items-center gap-2 mt-1">
                  <span id="current-channel-group" class="bg-blue-900/60 text-blue-300 border border-blue-700/50 text-xs px-2.5 py-0.5 rounded-full font-medium">
                    Categoría
                  </span>
                  <span id="current-channel-id" class="bg-gray-800 text-gray-400 text-xs px-2.5 py-0.5 rounded-full font-mono">
                    ID: -
                  </span>
                </div>
              </div>
            </div>

            <!-- Metadata Stats -->
            <div class="bg-gray-950/60 rounded-xl p-3 border border-gray-800/80 text-xs space-y-1 sm:min-w-[200px]">
              <div class="flex justify-between text-gray-400">
                <span>Nombre tvg:</span>
                <span id="meta-tvg-name" class="text-gray-200 font-mono text-right truncate max-w-[120px]">-</span>
              </div>
              <div class="flex justify-between text-gray-400">
                <span>Formato:</span>
                <span class="text-emerald-400 font-semibold">HLS / M3U8</span>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Right / Bottom: Channel List Grid -->
      <section class="lg:w-1/3 flex flex-col bg-gray-900 rounded-2xl border border-gray-800 shadow-md overflow-hidden h-[550px] lg:h-[650px] sticky top-20">
        <div class="p-4 border-b border-gray-800 flex items-center justify-between bg-gray-900/80">
          <div class="flex items-center space-x-2">
            <i data-lucide="list" class="w-5 h-5 text-blue-400"></i>
            <h3 class="font-bold text-gray-200">Lista de Canales</h3>
          </div>
          <span id="channel-count" class="bg-blue-600/20 text-blue-400 border border-blue-500/30 text-xs font-semibold px-2.5 py-1 rounded-full">
            0 canales
          </span>
        </div>

        <!-- Channels Container with Internal Scroll -->
        <div id="channels-container" class="flex-1 overflow-y-auto p-3 space-y-2 max-h-full">
          <!-- Channels will be injected dynamically here -->
        </div>
      </section>

    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 border-t border-gray-800 text-gray-400 p-4 mt-auto">
      <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between text-xs gap-2">
        <p>
          TV Online PMM. &copy; <span id="copyright"></span> Todos los derechos reservados.
        </p>
        <p class="text-gray-500">
          Lista sincronizada desde Github M3U
        </p>
      </div>
    </footer>

    <!-- IPTV App Script -->
    <script>
      const M3U_URL = 'https://raw.githubusercontent.com/pedromm90/Listados-IPTV-Actualizables/refs/heads/main/LISTADO_M3U.m3u';

      // Diccionario de logotipos CDN garantizados (TV-Logos Repository CDN)
      const KNOWN_LOGOS = {
        'dsports': 'https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/world-latin-america/dsports-lam.png',
        'a&e': 'https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/argentina/a-and-e-ar.png',
        'amc': 'https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/argentina/amc-ar.png',
        'axn': 'https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/argentina/axn-ar.png',
        'animal': 'https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/canada/animal-planet-hd-ca.png',
        'cinecanal': 'https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/mexico/cinecanal-mx.png',
        'cnne': 'https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/united-states/cnn-us.png',
        'cpremier': 'https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/argentina/cinemax-ar.png',
        'cmx': 'https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/argentina/cinemax-ar.png',
        'dhe': 'https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/argentina/amc-ar.png',
        'disctheater': 'https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/argentina/discovery-channel-ar.png',
        'discovery': 'https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/argentina/discovery-channel-ar.png',
        'discid': 'https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/argentina/discovery-channel-ar.png',
        'disckids': 'https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/argentina/discovery-kids-ar.png',
        'discworld': 'https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/argentina/discovery-channel-ar.png',
        'discjr': 'https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/argentina/discovery-kids-ar.png',
        'espn4': 'https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/argentina/espn-extra-ar.png',
        'espn2': 'https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/argentina/espn-2-ar.png',
        'espn3': 'https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/argentina/espn-3-ar.png',
        'espn5': 'https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/argentina/espn-extra-ar.png',
        'espn6': 'https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/argentina/espn-ar.png',
        'espn7': 'https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/argentina/espn-ar.png',
        'espnhd': 'https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/argentina/espn-ar.png',
        'espn': 'https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/united-states/espn-us.png',
        'espnpremium': 'https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/argentina/espn-premium-ar.png',
        'fx': 'https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/argentina/fx-ar.png',
        'gold': 'https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/united-kingdom/gold-uk.png',
        'hbofamily': 'https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/argentina/hbo-family-ar.png',
        'hbohd': 'https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/argentina/hbo-ar.png',
        'hboplus': 'https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/argentina/hbo-plus-ar.png',
        'hboxtreme': 'https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/argentina/hbo-xtreme-ar.png',
        'hbo2': 'https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/argentina/hbo-2-ar.png',
        'hbo': 'https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/united-states/hbo-us.png',
        'history': 'https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/argentina/history-channel-ar.png',
        'hh': 'https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/argentina/history-channel-2-ar.png',
        'natgeo': 'https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/argentina/national-geographic-ar.png',
        'sony': 'https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/argentina/sony-channel-ar.png',
        'space': 'https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/argentina/space-ar.png',
        'star': 'https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/argentina/star-channel-ar.png',
        'studio universal': 'https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/argentina/studio-universal-ar.png',
        'tnt series': 'https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/argentina/tnt-series-ar.png',
        'tnt': 'https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/argentina/tnt-ar.png',
        'universal': 'https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/argentina/universal-tv-ar.png',
        'univision': 'https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/united-states/univision-us.png',
        'warner': 'https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/argentina/warner-channel-ar.png'
      };

      function resolveChannelLogo(tvgLogo, tvgId, tvgName, name) {
        const keysToTry = [
          (tvgId || '').toLowerCase().trim(),
          (tvgName || '').toLowerCase().trim(),
          (name || '').toLowerCase().trim()
        ];

        // 1. Priorizar coincidencia en nuestro mapa de CDN validado
        for (const rawKey of keysToTry) {
          if (!rawKey) continue;
          for (const [knownKey, logoUrl] of Object.entries(KNOWN_LOGOS)) {
            if (rawKey.includes(knownKey)) {
              return logoUrl;
            }
          }
        }

        // 2. Si viene un tvgLogo en el M3U y no es wikimedia roto, probarlo
        if (tvgLogo && tvgLogo.trim() !== '' && !tvgLogo.includes('wikimedia.org')) {
          return tvgLogo.trim();
        }

        return '';
      }

      let channels = [];
      let currentHls = null;
      let activeChannelIndex = -1;

      // DOM Elements
      const videoPlayer = document.getElementById('video-player');
      const playerLoading = document.getElementById('player-loading');
      const playerStatus = document.getElementById('player-status');
      const playerStatusText = document.getElementById('player-status-text');
      const retryBtn = document.getElementById('retry-btn');
      
      const currentLogo = document.getElementById('current-channel-logo');
      const currentName = document.getElementById('current-channel-name');
      const currentGroup = document.getElementById('current-channel-group');
      const currentId = document.getElementById('current-channel-id');
      const metaTvgName = document.getElementById('meta-tvg-name');

      const channelsContainer = document.getElementById('channels-container');
      const channelCountEl = document.getElementById('channel-count');
      const searchInput = document.getElementById('search-input');
      const groupSelect = document.getElementById('group-select');

      // Set copyright year
      document.getElementById('copyright').innerText = new Date().getFullYear();

      // Initialize Lucide icons
      lucide.createIcons();

      // Parse M3U line by line capturing metadata
      function parseM3U(m3uText) {
        const lines = m3uText.split(/\r?\n/);
        const parsedChannels = [];
        let currentMetadata = null;

        for (let i = 0; i < lines.length; i++) {
          const line = lines[i].trim();
          if (!line) continue;

          if (line.startsWith('#EXTINF:')) {
            // Extract attributes using regex
            const tvgIdMatch = line.match(/tvg-id="([^"]*)"/i);
            const tvgNameMatch = line.match(/tvg-name="([^"]*)"/i);
            const tvgLogoMatch = line.match(/tvg-logo="([^"]*)"/i);
            const groupTitleMatch = line.match(/group-title="([^"]*)"/i);

            // Channel name is after the last comma
            const commaIndex = line.lastIndexOf(',');
            const name = commaIndex !== -1 ? line.substring(commaIndex + 1).trim() : 'Canal sin nombre';

            const tvgLogoVal = tvgLogoMatch ? tvgLogoMatch[1] : '';

            currentMetadata = {
              name: name,
              tvgId: tvgIdMatch ? tvgIdMatch[1] : '',
              tvgName: tvgNameMatch ? tvgNameMatch[1] : '',
              logo: resolveChannelLogo(tvgLogoVal, tvgIdMatch ? tvgIdMatch[1] : '', tvgNameMatch ? tvgNameMatch[1] : '', name),
              group: groupTitleMatch ? groupTitleMatch[1] : 'General',
            };
          } else if (!line.startsWith('#') && currentMetadata) {
            // It's a stream URL
            currentMetadata.url = line;
            parsedChannels.push(currentMetadata);
            currentMetadata = null;
          }
        }
        return parsedChannels;
      }

      // Populate group filter dropdown
      function updateGroupDropdown(channelList) {
        const groups = new Set();
        channelList.forEach(ch => {
          if (ch.group) groups.add(ch.group);
        });

        // Clear existing options except ALL
        groupSelect.innerHTML = '<option value="ALL">Todas las Categorías</option>';
        Array.from(groups).sort().forEach(group => {
          const opt = document.createElement('option');
          opt.value = group;
          opt.textContent = group;
          groupSelect.appendChild(opt);
        });
      }

      // Render channels list UI
      function renderChannels(channelList) {
        channelsContainer.innerHTML = '';
        channelCountEl.textContent = `${channelList.length} canal${channelList.length !== 1 ? 'es' : ''}`;

        if (channelList.length === 0) {
          channelsContainer.innerHTML = `
            <div class="text-center py-12 text-gray-500">
              <i data-lucide="tv-off" class="w-10 h-10 mx-auto mb-2 opacity-50"></i>
              <p>No se encontraron canales</p>
            </div>
          `;
          lucide.createIcons();
          return;
        }

        channelList.forEach((ch) => {
          const originalIndex = channels.indexOf(ch);
          const isSelected = originalIndex === activeChannelIndex;

          const item = document.createElement('div');
          item.className = `flex items-center space-x-3 p-3 rounded-xl cursor-pointer transition-all duration-200 border ${
            isSelected
              ? 'bg-blue-600/20 border-blue-500/80 text-white shadow-md shadow-blue-950/50'
              : 'bg-gray-800/60 hover:bg-gray-800 border-gray-800 text-gray-300 hover:text-white'
          }`;

          const fallbackLogo = 'https://via.placeholder.com/50?text=TV';
          const logoSrc = ch.logo ? ch.logo : fallbackLogo;

          item.innerHTML = `
            <div class="w-10 h-10 bg-gray-900 rounded-lg p-1 flex items-center justify-center flex-shrink-0 border border-gray-700/60">
              <img src="${logoSrc}" alt="${ch.name}" class="max-w-full max-h-full object-contain" onerror="this.onerror=null; this.src='${fallbackLogo}';" />
            </div>
            <div class="flex-1 min-w-0">
              <h4 class="font-medium text-sm truncate">${ch.name}</h4>
              <p class="text-xs text-gray-400 truncate">${ch.group || 'Sin Categoría'}</p>
            </div>
            ${isSelected ? '<i data-lucide="play-circle" class="w-5 h-5 text-blue-400 flex-shrink-0"></i>' : ''}
          `;

          item.addEventListener('click', () => {
            playChannel(originalIndex);
          });

          channelsContainer.appendChild(item);
        });

        lucide.createIcons();
      }

      // Filter function
      function filterChannels() {
        const searchTerm = searchInput.value.toLowerCase();
        const selectedGroup = groupSelect.value;

        const filtered = channels.filter(ch => {
          const matchesSearch = ch.name.toLowerCase().includes(searchTerm) || 
                                (ch.tvgName && ch.tvgName.toLowerCase().includes(searchTerm));
          const matchesGroup = selectedGroup === 'ALL' || ch.group === selectedGroup;
          return matchesSearch && matchesGroup;
        });

        renderChannels(filtered);
      }

      // Play channel by index
      function playChannel(index) {
        if (index < 0 || index >= channels.length) return;

        activeChannelIndex = index;
        const channel = channels[index];

        // Update UI details
        currentName.textContent = channel.name;
        currentGroup.textContent = channel.group || 'General';
        currentId.textContent = channel.tvgId ? `ID: ${channel.tvgId}` : 'ID: N/A';
        metaTvgName.textContent = channel.tvgName || channel.name;

        const logoToSet = channel.logo || resolveChannelLogo('', channel.tvgId, channel.tvgName, channel.name);
        currentLogo.src = logoToSet || 'https://via.placeholder.com/80?text=TV';
        currentLogo.onerror = function() {
          this.onerror = null;
          this.src = 'https://via.placeholder.com/80?text=TV';
        };

        // Re-render list to show active state highlight
        filterChannels();

        // Load stream into player
        loadStream(channel.url);
      }

      // Load stream into HLS player or native video tag
      function loadStream(url) {
        playerStatus.classList.add('hidden');
        playerLoading.classList.remove('hidden');

        if (currentHls) {
          currentHls.destroy();
          currentHls = null;
        }

        if (Hls.isSupported()) {
          const hls = new Hls({
            enableWorker: true,
            lowLatencyMode: true,
            manifestLoadingTimeOut: 10000,
          });
          currentHls = hls;

          hls.loadSource(url);
          hls.attachMedia(videoPlayer);

          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            playerLoading.classList.add('hidden');
            videoPlayer.play().catch(e => console.log('Autoplay prevented:', e));
          });

          hls.on(Hls.Events.ERROR, (event, data) => {
            if (data.fatal) {
              playerLoading.classList.add('hidden');
              showPlayerError('No se pudo reproduci la señal en vivo. Es posible que el servidor emisor no responda o bloquee CORS.');
              switch (data.type) {
                case Hls.ErrorTypes.NETWORK_ERROR:
                  console.error('Fatal network error encountered, try to recover');
                  break;
                case Hls.ErrorTypes.MEDIA_ERROR:
                  console.error('Fatal media error encountered, try to recover');
                  hls.recoverMediaError();
                  break;
                default:
                  hls.destroy();
                  break;
              }
            }
          });
        } else if (videoPlayer.canPlayType('application/vnd.apple.mpegurl')) {
          // Native support (Safari)
          videoPlayer.src = url;
          videoPlayer.addEventListener('loadedmetadata', () => {
            playerLoading.classList.add('hidden');
            videoPlayer.play();
          });
          videoPlayer.addEventListener('error', () => {
            playerLoading.classList.add('hidden');
            showPlayerError('Error al cargar la señal de video.');
          });
        } else {
          playerLoading.classList.add('hidden');
          showPlayerError('Su navegador no soporta la reproducción de este formato (HLS).');
        }
      }

      function showPlayerError(message) {
        playerStatusText.textContent = message;
        playerStatus.classList.remove('hidden');
      }

      // Event listeners
      searchInput.addEventListener('input', filterChannels);
      groupSelect.addEventListener('change', filterChannels);
      retryBtn.addEventListener('click', () => {
        if (activeChannelIndex !== -1) {
          playChannel(activeChannelIndex);
        }
      });

      // Copy M3U URL button logic
      const copyM3uBtn = document.getElementById('copy-m3u-btn');
      const copyBtnText = document.getElementById('copy-btn-text');

      copyM3uBtn.addEventListener('click', async () => {
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(M3U_URL);
          } else {
            // Fallback for non-https or older browser environments
            const textArea = document.createElement('textarea');
            textArea.value = M3U_URL;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
          }

          // Interactive feedback
          copyM3uBtn.classList.remove('bg-blue-600/20', 'text-blue-400', 'border-blue-500/30');
          copyM3uBtn.classList.add('bg-emerald-600', 'text-white', 'border-emerald-500');
          copyBtnText.textContent = '¡Copiado!';

          setTimeout(() => {
            copyM3uBtn.classList.remove('bg-emerald-600', 'text-white', 'border-emerald-500');
            copyM3uBtn.classList.add('bg-blue-600/20', 'text-blue-400', 'border-blue-500/30');
            copyBtnText.textContent = 'Copiar M3U';
          }, 2000);
        } catch (err) {
          console.error('Error al copiar:', err);
        }
      });

      // Fetch M3U List on start
      async function initApp() {
        try {
          const response = await fetch(M3U_URL);
          if (!response.ok) throw new Error('Error al descargar el archivo M3U');
          const data = await response.text();

          channels = parseM3U(data);
          updateGroupDropdown(channels);
          renderChannels(channels);

          // Auto play first channel if available
          if (channels.length > 0) {
            playChannel(0);
          }
        } catch (err) {
          console.error(err);
          showPlayerError('No se pudo cargar la lista de canales IPTV.');
        }
      }

      initApp();
    </script>
  </body>
</html>
